<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Cadent Family logo — a C and F combined">
  <defs>
    <linearGradient id="cadC" x1="18" y1="18" x2="102" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cadF" x1="42" y1="28" x2="86" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="cadBlur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      @keyframes cadPulse {
        0%, 100% { opacity: .32; transform: scale(1); }
        50%      { opacity: .60; transform: scale(1.03); }
      }
      .cad-glow { transform-origin: 60px 60px; animation: cadPulse 4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cad-glow { animation: none; opacity: .5; } }
    </style>
  </defs>

  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
    <!-- slow, subtle pulsing glow (F behind, C in front) -->
    <g class="cad-glow" filter="url(#cadBlur)">
      <path d="M42.3 31.2 V88.8 M42.3 31.2 H83.7 M42.3 59.1 H72.9" stroke="url(#cadF)" stroke-width="10.8"/>
      <path d="M85.7 29.4 A40 40 0 0 0 33.6 30 M29.7 33.9 A40 40 0 0 0 29.6 86 M33.6 90 A40 40 0 0 0 85.7 90.6" stroke="url(#cadC)" stroke-width="11.7"/>
    </g>
    <!-- crisp foreground: F behind, C in front -->
    <g>
      <path d="M42.3 31.2 V88.8 M42.3 31.2 H83.7 M42.3 59.1 H72.9" stroke="url(#cadF)" stroke-width="10.8"/>
      <path d="M85.7 29.4 A40 40 0 0 0 33.6 30 M29.7 33.9 A40 40 0 0 0 29.6 86 M33.6 90 A40 40 0 0 0 85.7 90.6" stroke="url(#cadC)" stroke-width="11.7"/>
    </g>
  </g>
</svg>
