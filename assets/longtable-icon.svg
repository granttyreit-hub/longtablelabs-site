<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Longtable Labs">
  <!-- app-icon mark: navy tile with the long table -->
  <rect x="0" y="0" width="72" height="72" rx="16" fill="#14263D"/>
  <g>
    <!-- table top: crema slab, espresso edge -->
    <rect x="10" y="38" width="52" height="6" fill="#E3D3B4"/>
    <rect x="10" y="44" width="52" height="3" fill="#7A5237"/>
    <!-- outer legs crema -->
    <rect x="12" y="47" width="4" height="19" fill="#E3D3B4"/>
    <rect x="56" y="47" width="4" height="19" fill="#E3D3B4"/>
    <!-- stretcher: coffee -->
    <rect x="16" y="59" width="40" height="2" fill="#8A5E42"/>
    <!-- seats: sky, one brass -->
    <circle cx="18" cy="26" r="5" fill="#7EA9C9"/>
    <circle cx="36" cy="26" r="5" fill="#7EA9C9"/>
    <circle cx="54" cy="26" r="5" fill="#D9A62B"/>
  </g>
</svg>
